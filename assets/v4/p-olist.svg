<svg xmlns="http://www.w3.org/2000/svg" width="900" height="134" viewBox="0 0 900 134" xml:space="preserve"><style>
.m{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Menlo,Consolas,'Courier New',monospace} .s{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif} .f{font-family:Cambria,'Noto Serif',Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0}60%{opacity:1}100%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.in{animation:in .6s ease-out both}
.inL{animation:inL .6s ease-out both}
.pop{animation:pop .5s ease-out both}
.caret{animation:blink 1s steps(1) infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.flow{stroke-dasharray:4 6;animation:flow 1.6s linear infinite}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 2.4s cubic-bezier(.4,0,.2,1) both}
</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFB347"/><stop offset=".55" stop-color="#FF8A5B"/><stop offset="1" stop-color="#FF6F91"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9F43" stop-opacity=".55"/><stop offset=".5" stop-color="#342C3B"/><stop offset="1" stop-color="#FF6F91" stop-opacity=".4"/></linearGradient><linearGradient id="gl" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0"><stop offset="0" stop-color="#FF9F43" stop-opacity=".8"/><stop offset="1" stop-color="#FF9F43" stop-opacity="0"/></linearGradient><pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#F6EBDD" opacity=".05"/></pattern></defs><rect x="1" y="1" width="898" height="132" rx="16" fill="#19161E"/><rect x="1" y="1" width="898" height="132" rx="16" fill="url(#grid)"/><rect x="1" y="1" width="898" height="132" rx="16" fill="none" stroke="url(#edge)" stroke-width="1.2"/><path d="M17 2H883" stroke="#FFFFFF" stroke-opacity=".07"/><rect x="1" y="22" width="3" height="90" rx="1.5" fill="#7FE0C2"/><g class="in" style="animation-delay:0.05s"><text x="26" y="43" class="f" font-size="22" font-weight="700" fill="#F6EBDD">Olist ELT Pipeline</text><g transform="translate(269,27)"><rect x="0" y="0" width="128" height="22" rx="11.0" fill="#7FE0C2" fill-opacity=".08" stroke="#7FE0C2" stroke-opacity=".45"/><text x="64" y="15.0" text-anchor="middle" class="m" font-size="11" fill="#7FE0C2">Data Engineering</text></g></g><g class="in" style="animation-delay:0.15s"><text x="26" y="74" class="s" font-size="15" fill="#CDBFAE">Pipeline nạp dữ liệu gia tăng: chạy lại không mất, không trùng dữ liệu.</text></g><g class="in" style="animation-delay:0.23s"><text x="26" y="97" class="s" font-size="15" fill="#CDBFAE">Kiểm tra chất lượng và đối soát ở mỗi bước; 17 test tự động.</text></g><text x="26" y="120" class="m" font-size="12" fill="#8C7F88">Python · MySQL · SQL · pytest</text><path d="M604 22V112" stroke="#342C3B"/><g class="pop" style="animation-delay:0.30s"><text x="870" y="68" text-anchor="end" class="m" font-size="30" font-weight="800" fill="#7FE0C2">99.441</text><text x="870" y="94" text-anchor="end" class="s" font-size="13.5" fill="#CDBFAE">đơn hàng được xử lý</text></g><text x="870" y="120" text-anchor="end" class="m" font-size="11.5" fill="#8C7F88">xem repo →</text></svg>