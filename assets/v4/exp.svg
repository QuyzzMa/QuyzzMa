<svg xmlns="http://www.w3.org/2000/svg" width="900" height="594" viewBox="0 0 900 594" xml:space="preserve"><style>
.m{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Menlo,Consolas,'Courier New',monospace} .s{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif} .f{font-family:Cambria,'Noto Serif',Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0}60%{opacity:1}100%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.in{animation:in .6s ease-out both}
.inL{animation:inL .6s ease-out both}
.pop{animation:pop .5s ease-out both}
.caret{animation:blink 1s steps(1) infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.flow{stroke-dasharray:4 6;animation:flow 1.6s linear infinite}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 2.4s cubic-bezier(.4,0,.2,1) both}
@keyframes wait{0%,100%{stroke-opacity:.3}50%{stroke-opacity:.95}}.wait{animation:wait 1.6s ease-in-out infinite}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}.rail{transform-origin:0 100%;animation:grow 1.6s ease-out both}</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFB347"/><stop offset=".55" stop-color="#FF8A5B"/><stop offset="1" stop-color="#FF6F91"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9F43" stop-opacity=".55"/><stop offset=".5" stop-color="#342C3B"/><stop offset="1" stop-color="#FF6F91" stop-opacity=".4"/></linearGradient><linearGradient id="gl" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0"><stop offset="0" stop-color="#FF9F43" stop-opacity=".8"/><stop offset="1" stop-color="#FF9F43" stop-opacity="0"/></linearGradient><pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#F6EBDD" opacity=".05"/></pattern></defs><path class="rail" d="M112 14V564" stroke="#342C3B" stroke-width="2.5" stroke-linecap="round"/><g class="inL" style="animation-delay:1.11s"><text x="92" y="32" text-anchor="end" class="m" font-size="11" fill="#FF7A85">hiện tại</text><rect class="wait" x="136" y="4" width="762" height="64" rx="14" fill="#FF7A85" fill-opacity=".05" stroke="#FF7A85" stroke-dasharray="6 5"/><g transform="translate(819,16)"><rect x="0" y="0" width="63" height="18" rx="9.0" fill="#FF7A85" fill-opacity=".08" stroke="#FF7A85" stroke-opacity=".45"/><text x="31" y="12.1" text-anchor="middle" class="m" font-size="8.5" fill="#FF7A85">MỤC TIÊU</text></g><text x="156" y="31" class="s" font-size="15" font-weight="700" fill="#F6EBDD">Tìm vị trí Data đầu tiên (DA / BI / DE)</text><text x="156" y="51" class="s" font-size="12.3" fill="#CDBFAE">Vị trí entry-level · TP. Hồ Chí Minh</text></g><circle class="pop" style="animation-delay:1.11s" cx="112" cy="28" r="7" fill="#121016" stroke="#FF7A85" stroke-width="3"/><g class="inL" style="animation-delay:0.95s"><text x="92" y="106" text-anchor="end" class="m" font-size="11" fill="#FFD166">hiện tại</text><rect x="136" y="78" width="762" height="64" rx="14" fill="#19161E" stroke="#342C3B"/><g transform="translate(814,90)"><rect x="0" y="0" width="68" height="18" rx="9.0" fill="#FFD166" fill-opacity=".08" stroke="#FFD166" stroke-opacity=".45"/><text x="34" y="12.1" text-anchor="middle" class="m" font-size="8.5" fill="#FFD166">CÔNG VIỆC</text></g><text x="156" y="105" class="s" font-size="15" font-weight="700" fill="#F6EBDD">Quản lý BaLi Services</text><text x="156" y="125" class="s" font-size="12.3" fill="#CDBFAE">Website, thiết kế, thẻ NFC, digital marketing</text></g><circle class="pop" style="animation-delay:0.95s" cx="112" cy="102" r="6" fill="#121016" stroke="#FFD166" stroke-width="3"/><g class="inL" style="animation-delay:0.79s"><text x="92" y="180" text-anchor="end" class="m" font-size="11" fill="#7FE0C2">11/2026</text><rect x="136" y="152" width="762" height="82" rx="14" fill="#19161E" stroke="#342C3B"/><g transform="translate(834,164)"><rect x="0" y="0" width="48" height="18" rx="9.0" fill="#7FE0C2" fill-opacity=".08" stroke="#7FE0C2" stroke-opacity=".45"/><text x="24" y="12.1" text-anchor="middle" class="m" font-size="8.5" fill="#7FE0C2">DỰ ÁN</text></g><text x="156" y="179" class="s" font-size="15" font-weight="700" fill="#F6EBDD">Olist ELT — pipeline dữ liệu gia tăng</text><text x="156" y="199" class="s" font-size="12.3" fill="#CDBFAE">Python · MySQL · pytest — 99.441 đơn hàng</text><text x="156" y="218" class="s" font-size="12.3" fill="#8C7F88">1 fact / 4 dim · 3 mart · 17 test tự động</text></g><circle class="pop" style="animation-delay:0.79s" cx="112" cy="176" r="6" fill="#121016" stroke="#7FE0C2" stroke-width="3"/><g class="inL" style="animation-delay:0.63s"><text x="92" y="272" text-anchor="end" class="m" font-size="11" fill="#7FE0C2">2026</text><rect x="136" y="244" width="762" height="82" rx