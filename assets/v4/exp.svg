rx="1.5" fill="#FFD166"/><text x="24" y="184" class="m" font-size="11" fill="#FFD166">hiện tại</text><text x="132" y="174" class="s" font-size="15" font-weight="700" fill="#F6EBDD">Quản lý BaLi Services</text><text x="132" y="194" class="s" font-size="12.3" fill="#CDBFAE">Website, thiết kế, thẻ NFC, digital marketing</text></g><g class="inL" style="animation-delay:0.46s"><rect x="1" y="218" width="898" height="64" rx="14" fill="#19161E" stroke="#342C3B"/><rect x="1" y="234" width="3" height="32" rx="1.5" fill="#FF9F43"/><text x="24" y="256" class="m" font-size="11" fill="#FF9F43"></text><text x="132" y="246" class="s" font-size="15" font-weight="700" fill="#F6EBDD">Vận hành sàn thương mại điện tử</text><text x="132" y="266" class="s" font-size="12.3" fill="#CDBFAE">Kinh nghiệm vận hành trên sàn TMĐT</text></g></svg>