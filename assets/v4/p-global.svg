<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" xml:space="preserve"><style>
.m{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Menlo,Consolas,'Courier New',monospace} .s{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif} .f{font-family:Cambria,'Noto Serif',Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0}60%{opacity:1}100%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.in{animation:in .6s ease-out both}
.inL{animation:inL .6s ease-out both}
.pop{animation:pop .5s ease-out both}
.caret{animation:blink 1s steps(1) infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.flow{stroke-dasharray:4 6;animation:flow 1.6s linear infinite}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 2.4s cubic-bezier(.4,0,.2,1) both}
</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFB347"/><stop offset=".55" stop-color="#FF8A5B"/><stop offset="1" stop-color="#FF6F91"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9F43" stop-opacity=".55"/><stop offset=".5" stop-color="#342C3B"/><stop offset="1" stop-color="#FF6F91" stop-opacity=".4"/></linearGradient><linearGradient id="gl" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0"><stop offset="0" stop-color="#FF9F43" stop-opacity=".8"/><stop offset="1" stop-color="#FF9F43" stop-opacity="0"/></linearGradient><pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#F6EBDD" opacity=".05"/></pattern></defs><rect x="1" y="1" width="898" height="198" rx="16" fill="#19161E"/><rect x="1" y="1" width="898" height="198" rx="16" fill="url(#grid)"/><rect x="1" y="1" width="898" height="198" rx="16" fill="none" stroke="url(#edge)" stroke-width="1.2"/><path d="M17 2H883" stroke="#FFFFFF" stroke-opacity=".07"/><rect x="1" y="26" width="3" height="148" rx="1.5" fill="#FFD166"/><g class="in" style="animation-delay:0.05s"><text x="28" y="50" class="f" font-size="24" font-weight="700" fill="#F6EBDD">Global E-Commerce Sales</text><g transform="translate(28,66)"><rect x="0" y="0" width="116" height="28" rx="14.0" fill="#FFD166" fill-opacity=".08" stroke="#FFD166" stroke-opacity=".45"/><text x="58" y="18.3" text-anchor="middle" class="m" font-size="12" fill="#FFD166">Data Analysis</text></g></g><g class="pop" style="animation-delay:0.30s"><text x="872" y="56" text-anchor="end" class="m" font-size="32" font-weight="800" fill="#FFD166">26,4% → 6,9%</text><text x="872" y="86" text-anchor="end" class="s" font-size="15" fill="#CDBFAE">biên lợi nhuận khi giảm giá &gt; 20%</text></g><g class="in" style="animation-delay:0.15s"><text x="28" y="128" class="s" font-size="17" fill="#CDBFAE">Dashboard doanh thu và lợi nhuận từ 2.000 giao dịch.</text></g><g class="in" style="animation-delay:0.23s"><text x="28" y="155" class="s" font-size="17" fill="#CDBFAE">Phát hiện chiết khấu trên 20% kéo biên lợi nhuận từ 26,4% xuống 6,9%.</text></g><text x="28" y="182" class="m" font-size="13" fill="#8C7F88">Power Query · Excel (17 PivotTable) · Power BI</text><text x="872" y="182" text-anchor="end" class="m" font-size="13" fill="#8C7F88">xem repo →</text></svg>