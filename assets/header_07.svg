<svg xmlns="http://www.w3.org/2000/svg" width="900" height="78" viewBox="0 0 900 78" xml:space="preserve"><style>
.m{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Menlo,Consolas,'Courier New',monospace} .s{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0}60%{opacity:1}100%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.in{animation:in .6s ease-out both}
.inL{animation:inL .6s ease-out both}
.pop{animation:pop .5s ease-out both}
.caret{animation:blink 1s steps(1) infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.flow{stroke-dasharray:4 6;animation:flow 1.6s linear infinite}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 2.4s cubic-bezier(.4,0,.2,1) both}
@keyframes run{0%,80%{opacity:1}100%{opacity:0}}@keyframes ok{0%,80%{opacity:0}100%{opacity:1}}.run{opacity:0;animation:run 2s ease both}.ok{animation:ok 2s ease both}</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#2DD4BF"/></linearGradient><linearGradient id="gl" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0"><stop offset="0" stop-color="#34D399" stop-opacity=".8"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/></linearGradient><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#34D399" stroke-opacity=".045"/></pattern></defs><g class="inL"><text x="2" y="22" class="m" font-size="11" letter-spacing="1.6" fill="#34D399">07/08 <tspan fill="#5E8574">▸</tspan> SERVE</text><text x="3" y="54" class="s" font-size="24" font-weight="800" fill="#E2F5EC">Activity<tspan class="m" font-size="12.5" font-weight="400" fill="#5E8574">   — hoạt động trên GitHub</tspan></text></g><rect class="pop" style="animation-delay:0.00s" x="655" y="12" width="26" height="6" rx="3" fill="#34D399" fill-opacity=".55"/><rect class="pop" style="animation-delay:0.05s" x="686" y="12" width="26" height="6" rx="3" fill="#34D399" fill-opacity=".55"/><rect class="pop" style="animation-delay:0.10s" x="717" y="12" width="26" height="6" rx="3" fill="#34D399" fill-opacity=".55"/><rect class="pop" style="animation-delay:0.15s" x="748" y="12" width="26" height="6" rx="3" fill="#34D399" fill-opacity=".55"/><rect class="pop" style="animation-delay:0.20s" x="779" y="12" width="26" height="6" rx="3" fill="#34D399" fill-opacity=".55"/><rect class="pop" style="animation-delay:0.25s" x="810" y="12" width="26" height="6" rx="3" fill="#34D399" fill-opacity=".55"/><rect x="841" y="12" width="26" height="6" rx="3" fill="#0E2119" stroke="#1C3A2C"/><rect class="grow" style="animation-delay:.2s;animation-duration:1.6s" x="841" y="12" width="26" height="6" rx="3" fill="#A3E635"/><rect x="872" y="12" width="26" height="6" rx="3" fill="#0E2119" stroke="#1C3A2C"/><g class="run"><circle class="pulse" cx="804" cy="45" r="4" fill="#FBBF24"/><text x="898" y="49" text-anchor="end" class="m" font-size="11" letter-spacing="1" fill="#FBBF24">RUNNING…</text></g><g class="ok"><circle cx="804" cy="45" r="4" fill="#34D399"/><text x="898" y="49" text-anchor="end" class="m" font-size="11" letter-spacing="1" fill="#34D399">SUCCESS ✓</text></g><path d="M0 70H900" stroke="url(#gl)" stroke-width="1.2"/><circle r="2.6" fill="#A3E635"><animateMotion dur="2.2s" repeatCount="1" fill="freeze" path="M0 70H900"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;.9;1" dur="2.2s" fill="freeze"/></circle></svg>