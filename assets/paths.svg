ont-size="12.5" fill="#CDBFAE">Excel · Power Query · Power BI (dự án) · Tableau (đã học)</text><text x="25" y="239" class="m" font-size="9.5" letter-spacing="1.2" fill="#8C7F88">HƯỚNG ĐANG CÂN NHẮC</text><text x="25" y="259" class="s" font-size="12.5" fill="#CDBFAE">Business metrics &amp; KPI · data storytelling</text></g><g class="in" style="animation-delay:0.45s"><rect x="456" y="1" width="443" height="318" rx="18" fill="#19161E"/><rect x="456" y="1" width="443" height="318" rx="18" fill="url(#grid)"/><rect x="456" y="1" width="443" height="318" rx="18" fill="none" stroke="url(#edge)" stroke-width="1.2"/><path d="M474 2H881" stroke="#FFFFFF" stroke-opacity=".07"/><rect x="456" y="23" width="3" height="44" rx="1.5" fill="#7FE0C2"/><text x="480" y="35" class="m" font-size="10" letter-spacing="1" fill="#7FE0C2">⑂ branch: engineer</text><text x="480" y="65" class="f" font-size="23" font-weight="700" font-style="italic" fill="#F6EBDD">Data Engineer</text><text x="480" y="99" class="m" font-size="9.5" letter-spacing="1.2" fill="#8C7F88">ĐÃ LÀM</text><text x="480" y="119" class="s" font-size="12.5" font-weight="700" fill="#F6EBDD">Olist ELT: nạp gia tăng, idempotent, 17 test (MySQL)</text><text x="480" y="138" class="s" font-size="12.5" font-weight="700" fill="#F6EBDD">Retail DWH: Stored Procedure, 11 phép kiểm tra DQ</text><text x="480" y="169" class="m" font-size="9.5" letter-spacing="1.2" fill="#8C7F88">ĐANG HỌC / ĐÃ TÌM HIỂU</text><text x="480" y="189" class="s" font-size="12.5" fill="#CDBFAE">Polars · DuckDB (de_project) · PyArrow · PostgreSQL</text><text x="480" y="220" class="m" font-size="9.5" letter-spacing="1.2" fill="#FF7A85">CHƯA CÓ KINH NGHIỆM THỰC TẾ</text><text x="480" y="240" class="s" font-size="12.5" fill="#CDBFAE">Airflow · dbt · AWS</text></g><g class="in" style="animation-delay:0.80s"><rect x="1" y="334" width="898" height="44" rx="14" fill="#221D29" stroke="url(#edge)"/><text x="24" y="361" class="m" font-size="10" letter-spacing="1.2" fill="#8C7F88