<svg xmlns="http://www.w3.org/2000/svg" width="440" height="176" viewBox="0 0 440 176" xml:space="preserve"><style>
.m{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Menlo,Consolas,'Courier New',monospace} .s{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0}60%{opacity:1}100%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.in{animation:in .6s ease-out both}
.inL{animation:inL .6s ease-out both}
.pop{animation:pop .5s ease-out both}
.caret{animation:blink 1s steps(1) infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.flow{stroke-dasharray:4 6;animation:flow 1.6s linear infinite}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 2.4s cubic-bezier(.4,0,.2,1) both}
@keyframes nudge2{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}.ar2{animation:nudge2 1.6s ease-in-out infinite}</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#2DD4BF"/></linearGradient><linearGradient id="gl" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="440" y2="0"><stop offset="0" stop-color="#34D399" stop-opacity=".8"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/></linearGradient><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#34D399" stroke-opacity=".045"/></pattern></defs><rect x="1" y="1" width="438" height="174" rx="14" fill="#0A1712" stroke="#1C3A2C"/><rect x="1" y="1" width="438" height="174" rx="14" fill="url(#grid)"/><path d="M7 19V7H19" fill="none" stroke="#34D399" stroke-opacity=".55" stroke-width="1.5"/><path d="M433 19V7H421" fill="none" stroke="#34D399" stroke-opacity=".55" stroke-width="1.5"/><path d="M7 157V169H19" fill="none" stroke="#34D399" stroke-opacity=".55" stroke-width="1.5"/><path d="M433 157V169H421" fill="none" stroke="#34D399" stroke-opacity=".55" stroke-width="1.5"/><defs><linearGradient id="wash2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2DD4BF" stop-opacity=".14"/><stop offset=".6" stop-color="#2DD4BF" stop-opacity="0"/></linearGradient></defs><rect x="1" y="1" width="438" height="174" rx="14" fill="url(#wash2)"/><rect x="1" y="26" width="3" height="124" rx="1.5" fill="#2DD4BF"/><g class="in" style="animation-delay:0.05s"><rect x="24" y="22" width="120" height="20" rx="10" fill="#2DD4BF" fill-opacity=".12" stroke="#2DD4BF" stroke-opacity=".5"/><text x="84" y="35.5" text-anchor="middle" class="m" font-size="9.5" letter-spacing=".8" fill="#2DD4BF">META · COURSERA</text></g><g class="pop" style="animation-delay:0.30s"><rect x="352" y="20" width="64" height="46" rx="4" fill="#0E2119" stroke="#2DD4BF" stroke-opacity=".6"/><rect x="356" y="24" width="56" height="38" rx="2" fill="none" stroke="#2DD4BF" stroke-opacity=".25"/><path d="M362 33H392M362 40H386M362 47H390" stroke="#A7C4B5" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/><circle cx="400" cy="52" r="7" fill="#2DD4BF" fill-opacity=".25" stroke="#2DD4BF"/><path d="M397 58L395 66L400 63L405 66L403 58" fill="#2DD4BF" fill-opacity=".6"/><circle class="pulse" cx="400" cy="52" r="11" fill="none" stroke="#2DD4BF" stroke-opacity=".5"/></g><g class="in" style="animation-delay:0.15s"><text x="24" y="82" class="s" font-size="19" font-weight="800" fill="#E2F5EC">Meta Data Analyst</text><text x="24" y="104" class="s" font-size="12.5" fill="#A7C4B5">Professional Certificate</text></g><path d="M24 126H416" stroke="#1C3A2C" stroke-dasharray="3 5"/><text x="24" y="152" class="m" font-size="10.5" fill="#5E8574">ID EHKV5G1FTIKI</text><g class="in" style="animation-delay:0.40s"><text x="396" y="152" text-anchor="end" class="m" font-size="11.5" font-weight="700" fill="#2DD4BF">Xem chứng chỉ</text><text class="ar2 m" x="402" y="152" font-size="12" font-weight="700" fill="#2DD4BF">→</text></g></svg>