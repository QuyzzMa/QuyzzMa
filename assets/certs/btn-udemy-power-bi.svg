ity=".12" stroke="#FBBF24" stroke-opacity=".7"/><text x="383" y="52.0" text-anchor="middle" class="m" font-size="11" font-weight="700" fill="#FBBF24">XEM ↗</text></g><circle class="pulse" cx="418" cy="16" r="3" fill="#34D399"/><text x="410" y="19" text-anchor="end" class="m" font-size="9" fill="#34D399">PASSED</text></svg>