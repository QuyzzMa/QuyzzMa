<svg xmlns="http://www.w3.org/2000/svg" width="440" height="176" viewBox="0 0 440 176" xml:space="preserve"><style>
.m{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Menlo,Consolas,'Courier New',monospace} .s{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif} .f{font-family:Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0}60%{opacity:1}100%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.in{animation:in .6s ease-out both}
.inL{animation:inL .6s ease-out both}
.pop{animation:pop .5s ease-out both}
.caret{animation:blink 1s steps(1) infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.flow{stroke-dasharray:4 6;animation:flow 1.6s linear infinite}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 2.4s cubic-bezier(.4,0,.2,1) both}
@keyframes nudge5{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}.ar5{animation:nudge5 1.6s ease-in-out infinite}</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFB347"/><stop offset=".55" stop-color="#FF8A5B"/><stop offset="1" stop-color="#FF6F91"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9F43" stop-opacity=".55"/><stop offset=".5" stop-color="#342C3B"/><stop offset="1" stop-color="#FF6F91" stop-opacity=".4"/></linearGradient><linearGradient id="gl" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="440" y2="0"><stop offset="0" stop-color="#FF9F43" stop-opacity=".8"/><stop offset="1" stop-color="#FF9F43" stop-opacity="0"/></linearGradient><pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#F6EBDD" opacity=".05"/></pattern></defs><rect x="1" y="1" width="438" height="174" rx="14" fill="#19161E"/><rect x="1" y="1" width="438" height="174" rx="14" fill="url(#grid)"/><rect x="1" y="1" width="438" height="174" rx="14" fill="none" stroke="url(#edge)" stroke-width="1.2"/><path d="M15 2H425" stroke="#FFFFFF" stroke-opacity=".07"/><defs><linearGradient id="wash5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD166" stop-opacity=".14"/><stop offset=".6" stop-color="#FFD166" stop-opacity="0"/></linearGradient></defs><rect x="1" y="1" width="438" height="174" rx="14" fill="url(#wash5)"/><rect x="1" y="26" width="3" height="124" rx="1.5" fill="#FFD166"/><g class="in" style="animation-delay:0.05s"><rect x="24" y="22" width="152" height="20" rx="10" fill="#FFD166" fill-opacity=".12" stroke="#FFD166" stroke-opacity=".5"/><text x="100" y="35.5" text-anchor="middle" class="m" font-size="9.5" letter-spacing=".8" fill="#FFD166">HACKERRANK · 10/2025</text></g><g class="pop" style="animation-delay:0.30s"><rect x="352" y="20" width="64" height="46" rx="4" fill="#221D29" stroke="#FFD166" stroke-opacity=".6"/><rect x="356" y="24" width="56" height="38" rx="2" fill="none" stroke="#FFD166" stroke-opacity=".25"/><path d="M362 33H392M362 40H386M362 47H390" stroke="#CDBFAE" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/><circle cx="400" cy="52" r="7" fill="#FFD166" fill-opacity=".25" stroke="#FFD166"/><path d="M397 58L395 66L400 63L405 66L403 58" fill="#FFD166" fill-opacity=".6"/><circle class="pulse" cx="400" cy="52" r="11" fill="none" stroke="#FFD166" stroke-opacity=".5"/></g><g class="in" style="animation-delay:0.15s"><text x="24" y="84" class="f" font-size="22" font-weight="700" fill="#F6EBDD">Python (Basic)</text><text x="24" y="104" class="s" font-size="12.5" fill="#CDBFAE">Skill certification test</text></g><path d="M24 126H416" stroke="#342C3B" stroke-dasharray="3 5"/><text x="24" y="152" class="m" font-size="10.5" fill="#8C7F88">ID 6499B222167B</text><g class="in" style="animation-delay:0.40s"><text x="396" y="152" text-anchor="end" class="m" font-size="11.5" font-weight="700" fill="#FFD166">Xem chứng chỉ</text><text class="ar5 m" x="402" y="152" font-size="12" font-weight="700" fill="#FFD166">→</text></g></svg>