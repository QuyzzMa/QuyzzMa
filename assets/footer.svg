<svg xmlns="http://www.w3.org/2000/svg" width="900" height="128" viewBox="0 0 900 128" xml:space="preserve"><style>
.m{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Menlo,Consolas,'Courier New',monospace} .s{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif} .f{font-family:Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0}60%{opacity:1}100%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.in{animation:in .6s ease-out both}
.inL{animation:inL .6s ease-out both}
.pop{animation:pop .5s ease-out both}
.caret{animation:blink 1s steps(1) infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.flow{stroke-dasharray:4 6;animation:flow 1.6s linear infinite}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 2.4s cubic-bezier(.4,0,.2,1) both}
</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFB347"/><stop offset=".55" stop-color="#FF8A5B"/><stop offset="1" stop-color="#FF6F91"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9F43" stop-opacity=".55"/><stop offset=".5" stop-color="#342C3B"/><stop offset="1" stop-color="#FF6F91" stop-opacity=".4"/></linearGradient><linearGradient id="gl" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0"><stop offset="0" stop-color="#FF9F43" stop-opacity=".8"/><stop offset="1" stop-color="#FF9F43" stop-opacity="0"/></linearGradient><pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#F6EBDD" opacity=".05"/></pattern></defs><path d="M0 22H900" stroke="url(#gl)"/><clipPath id="t1"><rect x="319.3" y="45.7" height="20.8" width="271"><animate attributeName="width" values="0;0;271" keyTimes="0;0.231;1" dur="1.30s" fill="freeze"/></rect></clipPath><g clip-path="url(#t1)"><text x="321.3" y="60" class="m" font-size="13"><tspan fill="#FF9F43">$</tspan><tspan fill="#F6EBDD"> git checkout -b </tspan><tspan fill="#FFD166">your-team</tspan></text></g><g class="in" style="animation-delay:1.60s"><text x="450.0" y="94" text-anchor="middle" class="s" font-size="13" fill="#CDBFAE">Cảm ơn bạn đã ghé qua — nếu team bạn đang tìm một fresher <tspan fill="#FF9F43">Data</tspan> <tspan fill="#7FE0C2">chú trọng chất lượng dữ liệu</tspan>, ping mình nhé.</text></g><g class="in" style="animation-delay:2.20s"><text x="450.0" y="118" text-anchor="middle" class="f" font-size="12" font-style="italic" fill="#8C7F88">— Quý</text></g></svg>