<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120" xml:space="preserve"><style>
.m{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Menlo,Consolas,'Courier New',monospace} .s{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif} .f{font-family:Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0}60%{opacity:1}100%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.in{animation:in .6s ease-out both}
.inL{animation:inL .6s ease-out both}
.pop{animation:pop .5s ease-out both}
.caret{animation:blink 1s steps(1) infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.flow{stroke-dasharray:4 6;animation:flow 1.6s linear infinite}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 2.4s cubic-bezier(.4,0,.2,1) both}
</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFB347"/><stop offset=".55" stop-color="#FF8A5B"/><stop offset="1" stop-color="#FF6F91"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9F43" stop-opacity=".55"/><stop offset=".5" stop-color="#342C3B"/><stop offset="1" stop-color="#FF6F91" stop-opacity=".4"/></linearGradient><linearGradient id="gl" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0"><stop offset="0" stop-color="#FF9F43" stop-opacity=".8"/><stop offset="1" stop-color="#FF9F43" stop-opacity="0"/></linearGradient><pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#F6EBDD" opacity=".05"/></pattern></defs><path d="M0 24H900" stroke="url(#gl)"/><clipPath id="t11"><rect x="245.20000000000002" y="47.7" height="20.8" width="420"><animate attributeName="width" values="0;0;420" keyTimes="0;0.214;1" dur="1.40s" fill="freeze"/></rect></clipPath><g clip-path="url(#t11)"><text x="247.20000000000002" y="62" class="m" font-size="13"><tspan fill="#FF9F43">COMMIT</tspan><tspan fill="#F6EBDD">;</tspan><tspan fill="#8C7F88">  -- watermark advanced · thank you for reading</tspan></text></g><g class="in" style="animation-delay:1.80s"><text x="450.0" y="94" text-anchor="middle" class="s" font-size="13" fill="#CDBFAE">Cảm ơn bạn đã ghé qua — nếu team bạn cần một người làm dữ liệu <tspan fill="#FFD166">đúng, đủ và chạy lại không sợ</tspan>, ping mình nhé.</text></g><g class="in" style="animation-delay:2.40s"><text x="450.0" y="114" text-anchor="middle" class="m" font-size="10.5" fill="#8C7F88">exit 0</text></g></svg>