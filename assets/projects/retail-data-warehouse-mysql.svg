="108" height="20" rx="5" fill="#0E2119" stroke="#2DD4BF" stroke-opacity=".5"/><text x="202" y="158" text-anchor="middle" class="mono" font-size="10" fill="#E2F5EC">1 fact + 3 dim</text><rect x="22" y="196" width="56" height="24" rx="12" fill="#2DD4BF" fill-opacity=".08" stroke="#2DD4BF" stroke-opacity=".45"/><text x="50" y="212" text-anchor="middle" class="mono" font-size="11" fill="#2DD4BF">MySQL</text><rect x="84.5" y="196" width="132" height="24" rx="12" fill="#2DD4BF" fill-opacity=".08" stroke="#2DD4BF" stroke-opacity=".45"/><text x="151" y="212" text-anchor="middle" class="mono" font-size="11" fill="#2DD4BF">Stored Procedure</text><rect x="222.9" y="196" width="98" height="24" rx="12" fill="#2DD4BF" fill-opacity=".08" stroke="#2DD4BF" stroke-opacity=".45"/><text x="272" y="212" text-anchor="middle" class="mono" font-size="11" fill="#2DD4BF">Star Schema</text></svg>