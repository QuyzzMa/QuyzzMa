<svg xmlns="http://www.w3.org/2000/svg" width="440" height="262" viewBox="0 0 440 262" xml:space="preserve"><style>
.m{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Menlo,Consolas,'Courier New',monospace} .s{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif} .f{font-family:Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0}60%{opacity:1}100%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.in{animation:in .6s ease-out both}
.inL{animation:inL .6s ease-out both}
.pop{animation:pop .5s ease-out both}
.caret{animation:blink 1s steps(1) infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.flow{stroke-dasharray:4 6;animation:flow 1.6s linear infinite}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 2.4s cubic-bezier(.4,0,.2,1) both}
@keyframes l2_0{0%,0%{fill-opacity:.06}6%{fill-opacity:.35}30%,100%{fill-opacity:.06}}@keyframes l2_1{0%,20%{fill-opacity:.06}26%{fill-opacity:.35}50%,100%{fill-opacity:.06}}@keyframes l2_2{0%,40%{fill-opacity:.06}46%{fill-opacity:.35}70%,100%{fill-opacity:.06}}</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFB347"/><stop offset=".55" stop-color="#FF8A5B"/><stop offset="1" stop-color="#FF6F91"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9F43" stop-opacity=".55"/><stop offset=".5" stop-color="#342C3B"/><stop offset="1" stop-color="#FF6F91" stop-opacity=".4"/></linearGradient><linearGradient id="gl" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="440" y2="0"><stop offset="0" stop-color="#FF9F43" stop-opacity=".8"/><stop offset="1" stop-color="#FF9F43" stop-opacity="0"/></linearGradient><pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#F6EBDD" opacity=".05"/></pattern></defs><rect x="1" y="1" width="438" height="260" rx="18" fill="#19161E"/><rect x="1" y="1" width="438" height="260" rx="18" fill="url(#grid)"/><rect x="1" y="1" width="438" height="260" rx="18" fill="none" stroke="url(#edge)" stroke-width="1.2"/><path d="M19 2H421" stroke="#FFFFFF" stroke-opacity=".07"/><clipPath id="pc2"><rect x="1" y="1" width="438" height="3" rx="1.5"/></clipPath><rect x="1" y="1" width="438" height="3" fill="#7FE0C2" fill-opacity=".25"/><g clip-path="url(#pc2)"><rect x="-120" y="1" width="120" height="3" fill="#7FE0C2"><animate attributeName="x" values="-120;440" dur="3s" repeatCount="indefinite"/></rect></g><text x="22" y="34" class="m" font-size="10.5" fill="#8C7F88">repo://QuyzzMa/<tspan fill="#7FE0C2">retail-data-warehouse-mysql</tspan></text><text x="418" y="34" text-anchor="end" class="m" font-size="10.5" fill="#8C7F88">2026</text><g class="in" style="animation-delay:0.10s"><text x="22" y="65" class="f" font-size="19" font-weight="700" fill="#F6EBDD">Retail Data Warehouse &amp; Incremental ETL</text></g><g class="in" style="animation-delay:0.25s"><text x="22" y="86" class="m" font-size="11.5" fill="#7FE0C2">1,000,000 rows · 11 SQL scripts · 11 DQ checks</text></g><g class="in" style="animation-delay:0.35s"><text x="22" y="110" class="s" font-size="12.3" fill="#CDBFAE">Stored Procedure nạp gia tăng, ETL log, đối soát</text></g><g class="in" style="animation-delay:0.45s"><text x="22" y="129" class="s" font-size="12.3" fill="#CDBFAE">tự động qua view: nạp + loại = nguồn.</text></g><rect x="22" y="162" width="36" height="24" rx="6" fill="#7FE0C2" fill-opacity=".06" stroke="#7FE0C2" stroke-opacity=".55" style="animation:l2_0 2.8s linear infinite"/><text x="40" y="178" text-anchor="middle" class="m" font-size="10" fill="#F6EBDD">CSV</text><path d="M61 174H73" stroke="#7FE0C2" stroke-opacity=".6"/><rect x="76" y="162" width="60" height="24" rx="6" fill="#7FE0C2" fill-opacity=".06" stroke="#7FE0C2" stroke-opacity=".55" style="animation:l2_1 2.8s linear infinite"/><text x="106" y="178" text-anchor="middle" class="m" font-size="10" fill="#F6EBDD">staging</text><path d="M139 174H151" stroke="#7FE0C2" stroke-opacity=".6"/><rect x="154" y="162" width="102" height="24" rx="6" fill="#7FE0C2" fill-opacity=".06" stroke="#7FE0C2" stroke-opacity=".55" style="animation:l2_2 2.8s linear infinite"/><text x="205" y="178" text-anchor="middle" class="m" font-size="10" fill="#F6EBDD">1 fact + 3 dim</text><circle r="3" fill="#FFD166"><animateMotion dur="1.7s" repeatCount="indefinite" path="M22 174H256"/></circle><rect x="22" y="218" width="54" height="22" rx="11.0" fill="#7FE0C2" fill-opacity=".08" stroke="#7FE0C2" stroke-opacity=".45"/><text x="49" y="232.8" text-anchor="middle" class="m" font-size="10.5" fill="#7FE0C2">MySQL</text><rect x="81.5" y="218" width="123" height="22" rx="11.0" fill="#7FE0C2" fill-opacity=".08" stroke="#7FE0C2" stroke-opacity=".45"/><text x="143" y="232.8" text-anchor="middle" class="m" font-size="10.5" fill="#7FE0C2">Stored Procedure</text><rect x="210.3" y="218" width="91" height="22" rx="11.0" fill="#7FE0C2" fill-opacity=".08" stroke="#7FE0C2" stroke-opacity=".45"/><text x="256" y="232.8" text-anchor="middle" class="m" font-size="10.5" fill="#7FE0C2">Star Schema</text></svg>