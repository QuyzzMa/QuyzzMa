<svg xmlns="http://www.w3.org/2000/svg" width="900" height="392" viewBox="0 0 900 392" xml:space="preserve"><style>
.m{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Menlo,Consolas,'Courier New',monospace} .s{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif} .f{font-family:Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0}60%{opacity:1}100%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.in{animation:in .6s ease-out both}
.inL{animation:inL .6s ease-out both}
.pop{animation:pop .5s ease-out both}
.caret{animation:blink 1s steps(1) infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.flow{stroke-dasharray:4 6;animation:flow 1.6s linear infinite}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 2.4s cubic-bezier(.4,0,.2,1) both}
</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFB347"/><stop offset=".55" stop-color="#FF8A5B"/><stop offset="1" stop-color="#FF6F91"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9F43" stop-opacity=".55"/><stop offset=".5" stop-color="#342C3B"/><stop offset="1" stop-color="#FF6F91" stop-opacity=".4"/></linearGradient><linearGradient id="gl" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0"><stop offset="0" stop-color="#FF9F43" stop-opacity=".8"/><stop offset="1" stop-color="#FF9F43" stop-opacity="0"/></linearGradient><pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".9" fill="#F6EBDD" opacity=".05"/></pattern></defs><rect x="1" y="1" width="898" height="390" rx="18" fill="#19161E"/><rect x="1" y="1" width="898" height="390" rx="18" fill="url(#grid)"/><rect x="1" y="1" width="898" height="390" rx="18" fill="none" stroke="url(#edge)" stroke-width="1.2"/><path d="M19 2H881" stroke="#FFFFFF" stroke-opacity=".07"/><circle class="pulse" cx="28" cy="25" r="4" fill="#FF9F43"/><text x="40" y="29" class="m" font-size="10.5" letter-spacing="1.2" fill="#8C7F88">~/quy <tspan fill="#CDBFAE">git log --graph --all</tspan></text><text x="874" y="29" text-anchor="end" class="m" font-size="10.5" fill="#8C7F88">HEAD → <tspan fill="#FFD166">exploring</tspan></text><path d="M1 44H899" stroke="#342C3B"/><g class="in" style="animation-delay:0.10s"><text x="30" y="104" class="f" font-size="52" font-style="italic" font-weight="700" fill="url(#g)">Mã Phú Quý</text></g><g class="in" style="animation-delay:0.30s"><text x="33" y="136" class="m" font-size="13" fill="#CDBFAE"><tspan fill="#FF9F43">Data Analyst</tspan> · <tspan fill="#FFD166">BI</tspan> · <tspan fill="#7FE0C2">Data Engineer</tspan></text></g><g class="in" style="animation-delay:0.45s"><text x="33" y="158" class="s" font-size="12.5" font-style="italic" fill="#8C7F88">đang khám phá cả hai hướng — chưa chốt, đang thu thập bằng chứng</text></g><g class="in" style="animation-delay:0.70s"><text x="33" y="204" class="s" font-size="14.5" fill="#F6EBDD">Nền tảng Kỹ thuật Phần mềm, có kinh nghiệm vận hành sàn TMĐT.</text><text x="33" y="228" class="s" font-size="14.5" fill="#F6EBDD">Mình dùng dữ liệu để trả lời câu hỏi kinh doanh,</text><text x="33" y="252" class="s" font-size="14.5" fill="#F6EBDD">và đang học cách xây pipeline đáng tin cho dữ liệu.</text></g><g class="in" style="animation-delay:1.00s"><text x="33" y="300" class="m" font-size="11" fill="#8C7F88">đang ưu tiên củng cố: <tspan fill="#F6EBDD">SQL</tspan> + <tspan fill="#F6EBDD">Python</tspan></text></g><g class="in" style="animation-delay:1.20s"><rect x="33" y="330" width="211" height="24" rx="12.0" fill="#FF9F43" fill-opacity=".08" stroke="#FF9F43" stroke-opacity=".45"/><text x="138" y="345.8" text-anchor="middle" class="m" font-size="10.5" fill="#FF9F43">Open to entry-level Data roles</text></g><g class="in" style="animation-delay:1.32s"><rect x="252.0" y="330" width="116" height="24" rx="12.0" fill="#FF7A85" fill-opacity=".08" stroke="#FF7A85" stroke-opacity=".45"/><text x="310" y="345.8" text-anchor="middle" class="m" font-size="10.5" fill="#FF7A85">TP. Hồ Chí Minh</text></g><g class="in" style="animation-delay:1.44s"><rect x="376.5" y="330" width="104" height="24" rx="12.0" fill="#FFD166" fill-opacity=".08" stroke="#FFD166" stroke-opacity=".45"/><text x="428" y="345.8" text-anchor="middle" class="m" font-size="10.5" fill="#FFD166">BaLi Services</text></g><path d="M548 196 H718" fill="none" stroke="#CDBFAE" stroke-width="3" stroke-linecap="round" style="--len:180;stroke-dasharray:180;animation:draw 1.1s ease-out 0.3s both"/><path d="M718 196 C744 196, 736 112, 764 112 H846 C866 112, 878 142, 878 196" fill="none" stroke="#FF9F43" stroke-width="3" stroke-linecap="round" style="--len:260;stroke-dasharray:260;animation:draw 1.1s ease-out 0.8s both"/><path d="M718 196 C744 196, 736 280, 764 280 H846 C866 280, 878 250, 878 196" fill="none" stroke="#7FE0C2" stroke-width="3" stroke-linecap="round" style="--len:260;stroke-dasharray:260;animation:draw 1.1s ease-out 1.3s both"/><circle r="3.5" fill="#FF9F43"><animateMotion dur="3.2s" begin="1.8s" repeatCount="indefinite" path="M718 196 C744 196, 736 112, 764 112 H846 C866 112, 878 142, 878 196"/></circle><circle r="3.5" fill="#7FE0C2"><animateMotion dur="3.8s" begin="2.1s" repeatCount="indefinite" path="M718 196 C744 196, 736 280, 764 280 H846 C866 280, 878 250, 878 196"/></circle><g class="pop" style="animation-delay:0.40s"><circle cx="586" cy="196" r="6" fill="#121016" stroke="#CDBFAE" stroke-width="3"/><text x="586" y="218" text-anchor="middle" class="m" font-size="9.5" fill="#CDBFAE">KTPM · ĐH Gia Định</text></g><g class="pop" style="animation-delay:0.60s"><circle cx="660" cy="196" r="6" fill="#121016" stroke="#CDBFAE" stroke-width="3"/><text x="660" y="182" text-anchor="middle" class="m" font-size="9.5" fill="#CDBFAE">BSC intern 2025</text></g><g class="pop" style="animation-delay:1.20s"><circle cx="758" cy="112" r="6" fill="#121016" stroke="#FF9F43" stroke-width="3"/><text x="758" y="98" text-anchor="middle" class="m" font-size="9.5" fill="#CDBFAE">Power BI</text></g><g class="pop" style="animation-delay:1.40s"><circle cx="838" cy="112" r="6" fill="#121016" stroke="#FF9F43" stroke-width="3"/><text x="838" y="98" text-anchor="middle" class="m" font-size="9.5" fill="#CDBFAE">Global E-Com</text></g><g class="pop" style="animation-delay:1.50s"><circle cx="758" cy="280" r="6" fill="#121016" stroke="#7FE0C2" stroke-width="3"/><text x="758" y="302" text-anchor="middle" class="m" font-size="9.5" fill="#CDBFAE">Retail DWH</text></g><g class="pop" style="animation-delay:1.70s"><circle cx="838" cy="280" r="6" fill="#121016" stroke="#7FE0C2" stroke-width="3"/><text x="838" y="302" text-anchor="middle" class="m" font-size="9.5" fill="#CDBFAE">Olist ELT</text></g><g class="in" style="animation-delay:1.00s"><rect x="758" y="70" width="62" height="20" rx="10.0" fill="#FF9F43" fill-opacity=".08" stroke="#FF9F43" stroke-opacity=".45"/><text x="789" y="83.4" text-anchor="middle" class="m" font-size="9.5" fill="#FF9F43">analyst</text></g><g class="in" style="animation-delay:1.30s"><rect x="758" y="320" width="68" height="20" rx="10.0" fill="#7FE0C2" fill-opacity=".08" stroke="#7FE0C2" stroke-opacity=".45"/><text x="792" y="333.4" text-anchor="middle" class="m" font-size="9.5" fill="#7FE0C2">engineer</text></g><g class="pop" style="animation-delay:2.40s"><circle class="pulse" cx="878" cy="196" r="15" fill="none" stroke="#FFD166" stroke-opacity=".6"/><circle cx="878" cy="196" r="9" fill="#FFD166" fill-opacity=".2" stroke="#FFD166" stroke-width="3"/><text x="878" y="200" text-anchor="middle" class="m" font-size="10" font-weight="700" fill="#FFD166">?</text></g><g class="in" style="animation-delay:2.80s"><text x="712" y="352" text-anchor="middle" class="m" font-size="10" fill="#8C7F88">hai nhánh song song · <tspan fill="#FFD166">?</tspan> = vị trí Data đầu tiên</text></g></svg>