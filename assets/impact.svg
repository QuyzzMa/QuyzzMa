="77" class="sans" font-size="13.5" font-weight="700" fill="#E2F5EC">test tự động</text><text x="629" y="97" class="sans" font-size="12.3" fill="#A7C4B5">pytest: incremental, rollback, rerun</text><text x="629" y="119" class="mono" font-size="10.5" fill="#5E8574">#olist-elt</text></g><g class="fade" style="animation-delay:0.36s"><rect x="1" y="147" width="290" height="132" rx="14" fill="#0B1A14" stroke="#1C3A2C"/><rect x="1" y="165" width="3" height="40" rx="1.5" fill="#34D399"/><text x="21" y="197" class="sans" font-size="32" font-weight="800" fill="#34D399">18</text><text x="21" y="223" class="sans" font-size="13.5" font-weight="700" fill="#E2F5EC">phép kiểm tra DQ</text><text x="21" y="243" class="sans" font-size="12.3" fill="#A7C4B5">7 mỗi lần chạy + 11 trong kho dữ liệu</text><text x="21" y="265" class="mono" font-size="10.5" fill="#5E8574">#data quality</text></g><g class="fade" style="animation-delay:0.48s"><rect x="305" y="147" width="290" height="132" rx="14" fill="#0B1A14" stroke="#1C3A2C"/><rect x="305" y="165" width="3" height="40" rx="1.5" fill="#FBBF24"/><text x="325" y="197" class="sans" font-size="32" font-weight="800" fill="#FBBF24">500+</text><text x="325" y="223" class="sans" font-size="13.5" font-weight="700" fill="#E2F5EC">product ID lỗi</text><text x="325" y="243" class="sans" font-size="12.3" fill="#A7C4B5">gán nhiều category/brand → đã sửa mô hình</text><text x="325" y="265" class="mono" font-size="10.5" fill="#5E8574">#retail-data-warehouse</text></g><g class="fade" style="animation-delay:0.60s"><rect x="609" y="147" width="290" height="132" rx="14" fill="#0B1A14" stroke="#1C3A2C"/><rect x="609" y="165" width="3" height="40" rx="1.5" fill="#2DD4BF"/><text x="629" y="197" class="sans" font-size="32" font-weight="800" fill="#2DD4BF">0</text><text x="629" y="223" class="sans" font-size="13.5" font-weight="700" fill="#E2F5EC">dòng mất · 0 trùng</text><text x="629" y="243" class="sans" font-size="12.3" fill="#A7C4B5">chạy lại bao nhiêu lần vẫn kh