<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64" xml:space="preserve"><style>
.mono{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace} .sans{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.caret{animation:blink 1s steps(1) infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeUp .8s ease-out both}
</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#2DD4BF"/></linearGradient><linearGradient id="gl" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0"><stop offset="0" stop-color="#34D399" stop-opacity=".9"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#34D399" opacity=".07"/></pattern></defs><rect x="1" y="16" width="52" height="30" rx="8" fill="#34D399" fill-opacity=".1" stroke="#34D399" stroke-opacity=".5"/><text x="27" y="36" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#34D399">04</text><text x="68" y="39" class="sans" font-size="21" font-weight="700" fill="#E2F5EC">Journey</text><text x="162" y="38" class="mono" font-size="12" fill="#5E8574">$ git log --oneline</text><path d="M317 31 H898" stroke="url(#gl)" stroke-width="1.3"/><circle class="pulse" cx="377" cy="31" r="3.5" fill="#34D399"/></svg>